# OpenTelemetry Collector configuration for the memcache extension.
#
# sudo ./dist/otelcol-memcache-probe --config=config/config.yaml --feature-gates=+service.profilesSupport
#

extensions:
  memcache:

receivers:
  profiling:
    probes:
      - memcache

exporters:
  debug:
    verbosity: detailed
  otlp_grpc/firepit:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true
      insecure_skip_verify: true

service:
  extensions: [memcache]
  pipelines:
    profiles:
      receivers: [profiling]
      exporters: [otlp_grpc/firepit]
